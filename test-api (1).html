<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test API Claude</title>
<style>
  body { font-family: sans-serif; padding: 2rem; background: #f0f0f0; }
  button { padding: 1rem 2rem; font-size: 1.1rem; background: #0099b8; color: white; border: none; border-radius: 10px; cursor: pointer; width: 100%; }
  #result { margin-top: 1.5rem; padding: 1rem; background: white; border-radius: 10px; white-space: pre-wrap; word-break: break-all; font-size: 0.85rem; min-height: 100px; }
</style>
</head>
<body>
  <h2>Test Claude API</h2>
  <button onclick="testAPI()">🤖 Probar conexión a Claude</button>
  <div id="result">Presioná el botón para probar...</div>

<script>
const API_KEY = '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';

async function testAPI() {
  const el = document.getElementById('result');
  el.textContent = 'Conectando...';

  try {
    el.textContent = 'Enviando request...';
    
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
        'x-api-key': API_KEY
      },
      body: JSON.stringify({
        model: 'claude-3-5-haiku-20241022',
        max_tokens: 50,
        messages: [{ role: 'user', content: 'Decí "hola" en español' }]
      })
    });

    el.textContent = 'Status: ' + response.status + '\n\n';

    const text = await response.text();
    el.textContent += 'Respuesta:\n' + text;

  } catch(e) {
    el.textContent = 'ERROR:\n' + e.toString() + '\n\nTipo: ' + e.name + '\nMensaje: ' + e.message;
  }
}
</script>
</body>
</html>
