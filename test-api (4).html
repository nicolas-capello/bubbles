<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test API Claude</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { font-family: sans-serif; padding: 2rem; background: #f0f0f0; }
  button { padding: 1rem 2rem; font-size: 1.1rem; background: #0099b8; color: white; border: none; border-radius: 10px; cursor: pointer; width: 100%; margin-bottom: 1rem; }
  #result { margin-top: 1rem; padding: 1rem; background: white; border-radius: 10px; white-space: pre-wrap; word-break: break-all; font-size: 0.85rem; min-height: 80px; }
</style>
</head>
<body>
  <h2>Test Claude API</h2>
  <button onclick="testAPI()">🤖 Probar conexión a Claude</button>
  <div id="result">Presioná el botón para probar...</div>

<script>
const SUPABASE_URL = 'https://vpxuaqihfelkyvqunany.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZweHVhcWloZmVsa3l2cXVuYW55Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIzMTI5MzQsImV4cCI6MjA4Nzg4ODkzNH0.SvFtR10wNBdERkbTC5qB1ZSwwt2yhfhI8yZ8_syaLxw';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function testAPI() {
  const el = document.getElementById('result');
  el.textContent = '1. Cargando key desde Supabase...';

  let apiKey = '';
  try {
    const { data, error } = await sb
      .from('configuracion')
      .select('valor')
      .eq('clave', 'claude_api_key')
      .single();
    
    if (error) {
      el.textContent = 'ERROR Supabase:\n' + JSON.stringify(error);
      return;
    }
    apiKey = data?.valor || '';
    el.textContent = '1. Key cargada: ' + (apiKey ? apiKey.slice(0,15) + '...' : 'VACÍA') + '\n\n2. Llamando a Claude...';
  } catch(e) {
    el.textContent = 'ERROR cargando key:\n' + e.toString();
    return;
  }

  if (!apiKey) {
    el.textContent = 'ERROR: Key vacía en Supabase';
    return;
  }

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
        'x-api-key': apiKey
      },
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 50,
        messages: [{ role: 'user', content: 'Decí "hola" en español' }]
      })
    });

    const text = await response.text();
    el.textContent = 'Status: ' + response.status + '\n\nRespuesta:\n' + text;

  } catch(e) {
    el.textContent = 'ERROR llamando Claude:\n' + e.toString();
  }
}
</script>
</body>
</html>
